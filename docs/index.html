<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设备管家</title>
<meta name="theme-color" content="#17191D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='14' rx='2.5' fill='%231E2126'/%3E%3Cpath d='M9 21h6M12 18v3' stroke='%23E8A33D' stroke-width='1.8' fill='none'/%3E%3Ccircle cx='8.5' cy='11' r='2' fill='%23E8A33D'/%3E%3Ccircle cx='15.5' cy='11' r='2' fill='%23E8A33D' opacity='.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#17191D; --panel:#1E2126; --panel2:#22262B; --raise:#262A30;
  --ink:#E6E2D8; --ink2:#8F959E; --line:#33373E; --line2:#3E434B;
  --amber:#E8A33D; --amber-d:#C98A2B; --amber-soft:#3A2F1D;
  --ok:#59B96C; --bad:#D85849; --info:#5D9BD8;
  --mono:"Cascadia Mono","Consolas","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
svg.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
/* ===== 顶栏 ===== */
#top{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--amber-soft);border:1px solid #4A3B21;display:flex;align-items:center;justify-content:center;color:var(--amber)}
.brand h1{margin:0;font-size:15.5px;letter-spacing:2px;font-weight:700;white-space:nowrap}
.viewswitch{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:3px}
.vs{border:none;background:transparent;color:var(--ink2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.vs.active{background:var(--amber-soft);color:var(--amber);font-weight:600}
.topbtns{margin-left:auto;display:flex;gap:8px;align-items:center}
.lamp{width:9px;height:9px;border-radius:50%;background:#4B5158;display:inline-block}
.lamp.on{background:var(--ok);box-shadow:0 0 8px rgba(89,185,108,.55);animation:breath 2.2s ease-in-out infinite}
@keyframes breath{50%{opacity:.5}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--raise);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--amber-d);color:var(--amber)}
.btn.pri{background:var(--amber);border-color:var(--amber-d);color:#17191D;font-weight:600}
.btn.pri:hover{background:var(--amber-d)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
/* ===== 网格总览 ===== */
#gridView{flex:1;overflow:auto;padding:14px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.cols1{grid-template-columns:minmax(0,520px);justify-content:center}
.grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px;margin:0 auto}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s}
.dcard:hover{border-color:var(--amber-d)}
.shotbox{position:relative;background:#101216;aspect-ratio:9/16;max-height:420px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.shotbox img{max-width:100%;max-height:100%;display:block}
.shotbox .corner{position:absolute;width:18px;height:18px;border:1.5px solid rgba(232,163,61,.75);pointer-events:none}
.shotbox .c-tl{left:7px;top:7px;border-right:none;border-bottom:none}
.shotbox .c-tr{right:7px;top:7px;border-left:none;border-bottom:none}
.shotbox .c-bl{left:7px;bottom:7px;border-right:none;border-top:none}
.shotbox .c-br{right:7px;bottom:7px;border-left:none;border-top:none}
.shotbox .tag{position:absolute;left:8px;top:8px;background:rgba(23,25,29,.82);color:var(--amber);border-radius:20px;padding:2px 9px;font-size:10.5px;font-family:var(--mono)}
.shotbox .more{position:absolute;right:6px;top:6px;background:rgba(23,25,29,.82);border:none;color:#CFD3D9;border-radius:7px;padding:5px 8px;cursor:pointer;font-size:12px}
.shotbox .more:hover{color:var(--bad)}
.shotbox .nolive{color:#5E646C;font-size:11px;text-align:center;padding:0 14px;line-height:1.9}
.dinfo{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2)}
.dname{min-width:0;flex:1}
.dname .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dname .s{color:var(--ink2);font-size:10.5px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.golive{flex:none;border:1px solid var(--amber-d);background:var(--amber);color:#17191D;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600}
.golive:hover{background:var(--amber-d)}
/* 添加设备卡片 */
.addcard{background:var(--panel);border:1.5px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:200px;gap:8px;padding:16px}
.addcard:hover{border-color:var(--amber-d)}
.addcard .plus{width:44px;height:44px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center}
.addcard .t{color:var(--ink2);font-size:12.5px}
.addform{width:100%;padding:4px 16px 16px}
.addform input{width:100%;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 11px;font-family:var(--mono);font-size:12.5px;margin-bottom:8px}
.addform input:focus{outline:2px solid #4A3B21;border-color:var(--amber-d)}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rchip{border:1px solid var(--line2);background:var(--bg);color:var(--ink2);border-radius:16px;padding:4px 10px;font-family:var(--mono);font-size:11px;cursor:pointer}
.rchip:hover{border-color:var(--amber);color:var(--amber)}
.emptygrid{padding:60px 20px;text-align:center;color:var(--ink2)}
.emptygrid .big{font-size:15px;letter-spacing:2px;color:var(--ink);margin-bottom:8px}
/* ===== 控制会话 ===== */
#ctlView{flex:1;display:flex;flex-direction:column;min-height:0}
.ctl-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.backbtn{border:1px solid var(--line2);background:var(--raise);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.backbtn:hover{border-color:var(--amber);color:var(--amber)}
.ctl-title{min-width:0;flex:1}
.ctl-title .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl-title .s{font-size:10.5px;color:var(--ink2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl-meta{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
#wrap{display:flex;flex:1;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
#colL{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 20px}
#colC{flex:1;display:flex;flex-direction:column;min-width:0}
#colR{width:320px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 20px}
.sect{margin-bottom:16px}
.sect-t{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:3px;color:var(--ink2);margin-bottom:8px}
.sect-t:after{content:"";flex:1;height:1px;background:var(--line)}
.devcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.devrow{display:flex;align-items:center;gap:10px;padding:3px 0}
.devrow .k{color:var(--ink2);width:64px;flex:none;font-size:11.5px}
.devrow .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.devrow .v.b{color:var(--amber)}
.empty-hint{color:var(--ink2);font-size:12px;line-height:1.9;padding:6px 2px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:14px 16px;position:relative;background:radial-gradient(ellipse 60% 50% at 50% 42%, #1B1E23 0%, var(--bg) 100%)}
#viewport{position:relative;max-width:100%;max-height:100%;cursor:crosshair;display:flex;align-items:center;justify-content:center}
#shot{max-width:100%;max-height:calc(100vh - 300px);display:block;border-radius:6px;user-select:none;-webkit-user-drag:none}
.corner{position:absolute;width:24px;height:24px;border:2px solid var(--amber);opacity:.9;pointer-events:none}
.c-tl{left:-8px;top:-8px;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.c-tr{right:-8px;top:-8px;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.c-bl{left:-8px;bottom:-8px;border-right:none;border-top:none;border-radius:0 0 0 4px}
.c-br{right:-8px;bottom:-8px;border-left:none;border-top:none;border-radius:0 0 4px 0}
#osd{position:absolute;left:0;top:0;right:0;padding:7px 11px 5px;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--amber);text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
#osd .rec{display:flex;align-items:center;gap:5px}
#osd .rec i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#osd .fps{margin-left:auto;color:#CFD3D9}
#deck{display:flex;align-items:flex-start;gap:14px;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:5px}
.kbd{border:1px solid var(--line2);background:var(--raise);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 #14161A}
.kbd:hover{border-color:var(--amber-d);color:var(--amber)}
.kbd:active{transform:translateY(2px);box-shadow:none}
.kbd.ctr{background:var(--amber-soft);border-color:#4A3B21;color:var(--amber)}
.deckmid{display:flex;flex-direction:column;gap:8px;min-width:190px;flex:1;max-width:320px}
.enterline{display:flex;gap:8px}
.enterline input{flex:1;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13px}
.enterline input:focus{outline:2px solid #4A3B21;border-color:var(--amber-d)}
.quickkeys{display:flex;gap:6px;flex-wrap:wrap}
.qk{border:1px solid var(--line2);background:var(--raise);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.qk:hover{border-color:var(--amber-d);color:var(--amber)}
.slider{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:11.5px}
input[type=range]{accent-color:var(--amber)}
/* 右栏 */
.search{width:100%;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:12.5px;margin-bottom:8px}
.search:focus{outline:2px solid #4A3B21;border-color:var(--amber-d)}
.applist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.approw{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #2A2E34}
.approw:last-child{border-bottom:none}
.approw:hover{background:#2A2E34}
.approw .pkg{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#CFD3D9}
.approw .rm{border:none;background:transparent;color:var(--ink2);cursor:pointer;border-radius:6px;padding:3px 6px;font-size:11px}
.approw .rm:hover{background:#4A3033;color:var(--bad)}
.filezone{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink2);font-size:12px;cursor:pointer;line-height:1.9}
.filezone:hover{border-color:var(--amber-d);color:var(--amber)}
.pullrow{display:flex;gap:8px;margin-top:10px}
.pullrow input{flex:1;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:11.5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0E0F12;border:1px solid var(--line2);color:var(--ink);padding:9px 16px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:70vw;box-shadow:0 10px 26px rgba(0,0,0,.4)}
#toast.show{opacity:1}
#toast.ok{border-color:#2E4A35;color:#8FCE9C}
#toast.bad{border-color:#4A3033;color:#E8A9A1}
.hidden{display:none!important}
.hint{color:var(--ink2);font-size:11.5px;line-height:1.9;margin:8px 0 0}
/* ===== 窄屏 ===== */
@media (max-width:960px){
  #top{padding:9px 10px;gap:6px;flex-wrap:wrap}
  .brand h1{font-size:14px;letter-spacing:1px}
  .brand .mark{width:28px;height:28px}
  .grid{grid-template-columns:repeat(2,1fr)!important;gap:10px;padding:0}
  .grid.cols1{grid-template-columns:1fr!important}
  .viewswitch{margin-left:auto}
  #ctlTopBar{display:flex;flex-direction:column;min-height:0;flex:1}
  #wrap{flex-direction:column;overflow:auto}
  #colL,#colR{width:100%;border:none;flex:none;display:none}
  #colC{flex:none;display:none}
  #colC.active,#colL.active,#colR.active{display:flex}
  #shot{max-height:calc(100vh - 300px)}
  .dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}
  .deckmid{min-width:150px}
}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6.5 8h11v4a5.5 5.5 0 0 1-11 0zM12 17.5V21"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 11.5 12 4.5l7.5 7v8.5h-15z"/><path d="M9.5 20v-6h5v6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="2"/><path d="M9 21h6M12 17.5V21"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
<symbol id="i-back2" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
</defs></svg>

<header id="top">
  <div class="brand">
    <span class="mark"><svg class="ic"><use href="#i-monitor"/></svg></span>
    <h1>设备管家</h1>
  </div>
  <div class="viewswitch">
    <button class="vs" id="vs1">单</button>
    <button class="vs active" id="vs2">2 宫格</button>
    <button class="vs" id="vs4">4 宫格</button>
  </div>
  <div class="topbtns">
    <span class="lamp" id="lamp"></span>
    <button class="btn" id="btnGlobalRefresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
    <button class="btn pri" id="btnAdd"><svg class="ic"><use href="#i-plus"/></svg>添加设备</button>
  </div>
</header>

<main id="gridView">
  <div class="grid cols2" id="grid"></div>
</main>

<div id="ctlView" class="hidden">
  <div class="ctl-top">
    <button class="backbtn" id="btnBack" title="返回总览"><svg class="ic"><use href="#i-back2"/></svg></button>
    <div class="ctl-title">
      <div class="n" id="ctlName">-</div>
      <div class="s" id="ctlSerial">-</div>
    </div>
    <div class="ctl-meta" id="ctlMeta"></div>
    <button class="btn danger" id="btnCtlDisconnect">断开</button>
  </div>
  <div id="ctlTopBar">
    <div id="wrap">
      <aside class="col" id="colL">
        <div class="sect">
          <div class="sect-t">设备信息</div>
          <div class="devcard" id="devcard"><p class="empty-hint">-</p></div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <button class="btn" id="btnRefresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新信息</button>
            <button class="btn" id="btnWake">点亮</button>
            <button class="btn" id="btnSleep">熄灭</button>
          </div>
        </div>
        <div class="sect" id="sectSlave" style="display:none">
          <div class="sect-t">被控模式 · 免 root 互联</div>
          <div class="devcard" id="shizukuCard">
            <div class="devrow"><span class="k">Shizuku</span><span class="v" id="szState">检测中…</span></div>
            <div class="devrow" id="szIpsRow" style="display:none"><span class="k">本机地址</span><span class="v b" id="szIps"></span></div>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="btnSzCheck"><svg class="ic"><use href="#i-refresh"/></svg>检查</button>
            <button class="btn" id="btnSzPerm">授权</button>
            <button class="btn pri" id="btnSzEnable">开启网络 ADB (5555)</button>
          </div>
          <p class="hint" id="szHint">开启后，局域网内其他设备管家即可直连本机。需配合 Shizuku（免 root，无线调试方式启动一次服务）。</p>
        </div>
        <div class="sect">
          <div class="sect-t">连接说明</div>
          <p class="empty-hint" id="connHint">目标设备需开启网络 ADB（5555）：电视盒子在设置中开启「网络调试」；手机先用电脑执行一次 <span style="font-family:var(--mono)">adb tcpip 5555</span>。</p>
        </div>
      </aside>

      <main class="col" id="colC">
        <div id="stage">
          <div id="viewport">
            <img id="shot" alt="" draggable="false">
            <span class="corner c-tl"></span><span class="corner c-tr"></span>
            <span class="corner c-bl"></span><span class="corner c-br"></span>
            <div id="osd">
              <span class="rec"><i></i>LIVE</span>
              <span class="res" id="osdRes"></span>
              <span class="fps" id="osdFps">-- fps</span>
            </div>
          </div>
        </div>
        <div id="deck">
          <div class="dpad">
            <span></span>
            <button class="kbd" data-key="up" title="上">▲</button>
            <span></span>
            <button class="kbd" data-key="left" title="左">◀</button>
            <button class="kbd ctr" data-key="confirm" title="确认">OK</button>
            <button class="kbd" data-key="right" title="右">▶</button>
            <span></span>
            <button class="kbd" data-key="down" title="下">▼</button>
            <span></span>
          </div>
          <div class="deckmid">
            <div class="enterline">
              <input id="textInput" placeholder="输入文字，发送到设备" enterkeyhint="send">
              <button class="btn pri" id="btnSendText">发送</button>
            </div>
            <div class="quickkeys">
              <button class="qk" data-key="home">主页</button>
              <button class="qk" data-key="back">返回</button>
              <button class="qk" data-key="menu">菜单</button>
              <button class="qk" data-key="recents">任务</button>
              <button class="qk" data-key="volup">音量＋</button>
              <button class="qk" data-key="voldown">音量－</button>
              <button class="qk" data-key="power">电源</button>
            </div>
            <div class="slider">刷新间隔 <input type="range" id="fpsSlider" min="3" max="30" value="10"> <b id="fpsLabel" style="font-family:var(--mono)">1.0s</b></div>
          </div>
          <button class="btn danger" id="btnReboot" title="重启设备"><svg class="ic"><use href="#i-power"/></svg>重启</button>
        </div>
      </main>

      <aside class="col" id="colR">
        <div class="sect">
          <div class="sect-t">应用管理</div>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input class="search" id="appSearch" placeholder="搜索包名…">
            <button class="btn" id="btnApps">列表</button>
            <button class="btn" id="btnInstall"><svg class="ic"><use href="#i-down"/></svg>装 APK</button>
          </div>
          <div class="applist" id="appList"><p class="empty-hint" style="padding:10px 12px">点击「列表」拉取设备上的第三方应用</p></div>
        </div>
        <div class="sect">
          <div class="sect-t">文件互传</div>
          <div class="filezone" id="pushZone">
            <svg class="ic" style="width:26px;height:26px;margin:0 auto 6px;color:var(--ink2)"><use href="#i-up"/></svg>
            点击选择文件，推送到设备 <span style="font-family:var(--mono)">/sdcard/Download/</span>
          </div>
          <div class="pullrow">
            <input id="pullPath" placeholder="/sdcard/DCIM/xxx.jpg" spellcheck="false">
            <button class="btn" id="btnPull">拉到本机</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>

<input type="file" id="apkPick" accept=".apk" style="display:none">
<input type="file" id="pushPick" style="display:none">
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const ADB = () => (IS_NATIVE && window.Capacitor.Plugins.AdbBridge) || null;
function b64ToBytes(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
let devices = [];        // [{serial, props}]
let curSerial = '';      // 控制会话目标
let viewCols = 2;
let polling = false, gridTimer = null, ctlTimer = null, inflight = false;
let pollMs = 1000, lastFrameAt = 0;
let recent = [];
try { recent = JSON.parse(localStorage.getItem('butler.recent') || '[]'); } catch(e){ recent = []; }

let toastTimer = null;
function toast(msg, cls){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + (cls || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ''; }, 3400);
}

async function api(path, body){
  const B = ADB();
  if (B){
    const a = body || {};
    try {
      switch(path){
        case '/api/status': return await B.status();
        case '/api/connect': await B.connect({addr: a.addr}); return {ok:true};
        case '/api/disconnect': await B.disconnect({serial: a.serial}); return {ok:true};
        case '/api/refresh': return await B.refresh({serial: a.serial});
        case '/api/tap': await B.tap({serial: a.serial, x: a.x, y: a.y}); return {ok:true};
        case '/api/key': await B.key({serial: a.serial, key: a.key}); return {ok:true};
        case '/api/text': await B.text({serial: a.serial, text: a.text}); return {ok:true};
        case '/api/apps': { const r = await B.apps({serial: a.serial}); return {ok:true, apps: r.apps || []}; }
        case '/api/uninstall': await B.uninstall({serial: a.serial, pkg: a.pkg}); return {ok:true};
        case '/api/screenshot': { const r = await B.screenshot({serial: a.serial}); return {ok:true, b64: r.b64}; }
        case '/api/pull': return await B.pull({serial: a.serial, path: a.path});
        case '/api/install': await B.install({serial: a.serial, name: a.name, data: a.data}); return {ok:true};
        case '/api/push': await B.push({serial: a.serial, name: a.name, data: a.data, remote: a.remote}); return {ok:true};
      }
      return {ok:false, msg:'未知接口'};
    } catch(e){ return {ok:false, msg: String(e && e.message || e)}; }
  }
  if (path === '/api/screenshot'){
    const r = await fetch('/api/screenshot?serial=' + encodeURIComponent(a.serial || ''), {cache:'no-store'});
    if (r.ok){ const blob = await r.blob(); return {ok:true, blob}; }
    let j = {}; try { j = await r.json(); } catch(e){}
    return {ok:false, msg:j.msg || '失败'};
  }
  if (path === '/api/pull'){
    const r = await fetch('/api/pull?serial=' + encodeURIComponent(a.serial || '') + '&path=' + encodeURIComponent(a.path || ''));
    if (r.ok){ const blob = await r.blob(); return {ok:true, blob, name: a.path.split('/').pop()}; }
    let j = {}; try { j = await r.json(); } catch(e){}
    return {ok:false, msg:j.msg || '失败'};
  }
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  try { return await r.json(); } catch(e){ return {ok:false, msg:'响应异常'} }
}

/* ---------- 状态 ---------- */
async function refreshStatus(){
  const s = await api('/api/status');
  const prev = devices.map(d=>d.serial);
  devices = s.devices || [];
  $('lamp').className = 'lamp' + (devices.length ? ' on' : '');
  if (curSerial && !devices.some(d=>d.serial === curSerial)){ leaveCtl(); }
  renderGrid();
  if (curSerial){
    const cur = devices.find(d=>d.serial === curSerial);
    if (cur) renderCtl(cur);
  }
}

/* ---------- 总览网格 ---------- */
function renderGrid(){
  const q = ($('searchBox') && $('searchBox').value || '').trim().toLowerCase();
  const list = devices.filter(d => {
    const p = d.props || {};
    return !q || d.serial.toLowerCase().includes(q) || (p.model||'').toLowerCase().includes(q);
  });
  const grid = $('grid');
  let html = '';
  for (const d of list){
    const p = d.props || {};
    const name = p.model || d.serial;
    const sub = [p.version ? 'Android ' + p.version : '', p.battery ? p.battery : ''].filter(Boolean).join(' · ') || '在线';
    html += '<div class="dcard" data-serial="' + d.serial + '">'
      + '<div class="shotbox" data-open="' + d.serial + '">'
      + '<img data-shot="' + d.serial + '" alt="">'
      + '<span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>'
      + '<span class="tag">' + esc(name) + '</span>'
      + '<button class="more" data-more="' + d.serial + '" title="断开">断开</button>'
      + '<div class="nolive" data-nolive="' + d.serial + '">等待画面…<br>设备需开启网络 ADB</div>'
      + '</div>'
      + '<div class="dinfo"><div class="dname"><div class="n">' + esc(name) + '</div><div class="s">' + esc(d.serial) + '</div></div>'
      + '<button class="golive" data-open="' + d.serial + '">控制</button></div>'
      + '</div>';
  }
  html += '<div class="addcard" id="addCard"><span class="plus"><svg class="ic" style="width:22px;height:22px"><use href="#i-plus"/></svg></span><span class="t">添加设备</span></div>'
    + '<div class="addcard hidden" id="addFormCard"><div class="addform">'
    + '<input id="addrInput" placeholder="IP:端口（如 192.168.5.18:5555）" spellcheck="false">'
    + '<button class="btn pri" id="btnDoConnect" style="width:100%;justify-content:center">连接</button>'
    + '<div class="recent" id="recentBox"></div>'
    + '</div></div>';
  grid.innerHTML = html;
  $('gridView').scrollTop = 0;
  if (devices.length === 0){
    grid.innerHTML = '<div class="emptygrid" style="grid-column:1/-1"><div class="big">还没有添加设备</div><div>点右上角「添加设备」，填入目标设备的 IP:端口<br>（电视盒子开「网络调试」，手机用电脑执行过一次 adb tcpip 5555）</div></div>'
      + '<div class="addcard" id="addCard2" style="grid-column:1/-1;max-width:400px;justify-self:center"><span class="plus"><svg class="ic" style="width:22px;height:22px"><use href="#i-plus"/></svg></span><span class="t">添加设备</span></div>';
    bindAddCards();
    return;
  }
  bindAddCards();
}
function bindAddCards(){
  document.querySelectorAll('[id^="addCard"]').forEach(c=>{
    c.addEventListener('click', ()=>{
      c.classList.add('hidden');
      const f = $('addFormCard');
      f.classList.remove('hidden');
      f.classList.remove('hidden');
      renderRecent();
      $('addrInput').focus();
    });
  });
  const btn = $('btnDoConnect');
  if (btn) btn.addEventListener('click', doConnect);
  const inp = $('addrInput');
  if (inp) inp.addEventListener('keydown', e=>{ if (e.key === 'Enter') doConnect(); });
  renderRecent();
}
function renderRecent(){
  const box = $('recentBox');
  if (!box) return;
  if (!recent.length){ box.innerHTML = '<span style="color:var(--ink2);font-size:11px">暂无历史连接</span>'; return; }
  box.innerHTML = recent.map(r => '<span class="rchip" data-addr="' + r + '">' + r + '</span>').join('');
  box.querySelectorAll('.rchip').forEach(c=>c.addEventListener('click', ()=>{
    $('addrInput').value = c.dataset.addr;
    doConnect();
  }));
}
async function doConnect(){
  const inp = $('addrInput');
  const addr = inp.value.trim();
  if (!addr){ toast('请输入 IP:端口', 'bad'); return; }
  const btn = $('btnDoConnect');
  btn.disabled = true; btn.textContent = '连接中…';
  const r = await api('/api/connect', {addr});
  btn.disabled = false; btn.textContent = '连接';
  if (r.ok){
    if (!recent.includes(addr)){ recent.unshift(addr); recent = recent.slice(0, 8); localStorage.setItem('butler.recent', JSON.stringify(recent)); }
    toast('已连接 ' + addr, 'ok');
    await refreshStatus();
    startGrid();
  } else toast('连接失败：' + (r.msg || '未知错误'), 'bad');
}

/* ---------- 轮询（总览轮播） ---------- */
function startGrid(){
  stopGrid();
  gridTimer = setInterval(gridTick, 1300);
}
function stopGrid(){ clearInterval(gridTimer); }
let gridIdx = 0;
async function gridTick(){
  if (!devices.length) return;
  const d = devices[gridIdx % devices.length];
  gridIdx++;
  const img = document.querySelector('[data-shot="' + d.serial + '"]');
  if (!img) return;
  try {
    const r = await api('/api/screenshot', {serial: d.serial});
    if (r.ok && r.b64){
      img.src = 'data:image/png;base64,' + r.b64;
      const nl = document.querySelector('[data-nolive="' + d.serial + '"]');
      if (nl) nl.style.display = 'none';
    }
  } catch(e){}
}

/* ---------- 控制会话 ---------- */
function openCtl(serial){
  curSerial = serial;
  stopGrid();
  $('gridView').classList.add('hidden');
  $('ctlView').classList.remove('hidden');
  const d = devices.find(x=>x.serial === serial) || {props:{}};
  renderCtl(d);
  if (innerWidth <= 960){ document.getElementById('colC').classList.add('active'); }
  startCtl();
}
function leaveCtl(){
  curSerial = '';
  stopCtl();
  $('ctlView').classList.add('hidden');
  $('gridView').classList.remove('hidden');
  renderGrid();
  startGrid();
}
function renderCtl(d){
  const p = d.props || {};
  $('ctlName').textContent = p.model || d.serial;
  $('ctlSerial').textContent = d.serial;
  $('ctlMeta').textContent = [p.version ? 'Android ' + p.version : '', p.battery || ''].filter(Boolean).join(' · ');
  const card = $('devcard');
  card.innerHTML = [
    ['型号', p.model || '-'],
    ['品牌', p.brand || '-'],
    ['系统', 'Android ' + (p.version || '-')],
    ['分辨率', p.resolution || '-'],
    ['电量', p.battery || '-'],
  ].map(r => '<div class="devrow"><span class="k">' + r[0] + '</span><span class="v' + (r[0]==='型号' ? ' b' : '') + '">' + String(r[1]).replace(/[<>&]/g, '') + '</span></div>').join('');
  $('osdRes').textContent = p.resolution || '';
}

/* 控制轮询 */
async function ctlTick(){
  if (!curSerial || inflight) return;
  inflight = true;
  try {
    const r = await api('/api/screenshot', {serial: curSerial});
    if (r.ok){
      const img = $('shot');
      if (r.b64) img.src = 'data:image/png;base64,' + r.b64;
      else if (r.blob){ const url = URL.createObjectURL(r.blob); if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.src = url; }
      const now = Date.now();
      if (lastFrameAt) $('osdFps').textContent = Math.round(1000/(now-lastFrameAt)) + ' fps';
      lastFrameAt = now;
    }
  } catch(e){}
  inflight = false;
}
function startCtl(){
  stopCtl();
  ctlTimer = setInterval(ctlTick, pollMs);
}
function stopCtl(){ clearInterval(ctlTimer); }
$('fpsSlider').addEventListener('input', e=>{
  pollMs = parseInt(e.target.value, 10) * 100;
  $('fpsLabel').textContent = (parseInt(e.target.value, 10)/10).toFixed(1) + 's';
  if (ctlTimer) startCtl();
});

/* 触控 */
$('shot').addEventListener('click', async e=>{
  if (!curSerial) return;
  const img = $('shot');
  if (!img.naturalWidth) return;
  const rect = img.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / rect.width * img.naturalWidth);
  const y = Math.round((e.clientY - rect.top) / rect.height * img.naturalHeight);
  await api('/api/tap', {serial: curSerial, x, y});
  setTimeout(ctlTick, 150);
});

/* 遥控 */
const KEYMAP = {up:'up', down:'down', left:'left', right:'right', confirm:'confirm', home:'home', back:'back', menu:'menu', recents:'recents', volup:'volup', voldown:'voldown', power:'power'};
document.querySelectorAll('[data-key]').forEach(b=>{
  b.addEventListener('click', async ()=>{
    if (!curSerial){ toast('未连接设备', 'bad'); return; }
    await api('/api/key', {serial: curSerial, key: KEYMAP[b.dataset.key]});
  });
});
$('btnSendText').addEventListener('click', sendText);
$('textInput').addEventListener('keydown', e=>{ if (e.key === 'Enter') sendText(); });
async function sendText(){
  const t = $('textInput').value;
  if (!t){ toast('请输入文字', 'bad'); return; }
  if (!curSerial){ toast('未连接设备', 'bad'); return; }
  const r = await api('/api/text', {serial: curSerial, text:t});
  if (r.ok){ $('textInput').value = ''; toast('已发送', 'ok'); setTimeout(ctlTick, 200); }
  else toast('发送失败');
}
$('btnWake').addEventListener('click', ()=> api('/api/key', {serial: curSerial, key:'wake'}));
$('btnSleep').addEventListener('click', ()=> api('/api/key', {serial: curSerial, key:'sleep'}));
$('btnReboot').addEventListener('click', async ()=>{
  if (!curSerial) return;
  if (!confirm('确定重启设备？')) return;
  stopCtl();
  await api('/api/key', {serial: curSerial, key:'power'});
  toast('已发送重启组合键');
});
$('btnRefresh').addEventListener('click', async ()=>{
  const r = await api('/api/refresh', {serial: curSerial});
  if (r.ok){ renderCtl({serial: curSerial, props: r.props || {}}); toast('已刷新', 'ok'); }
  else toast('刷新失败');
});
$('btnBack').addEventListener('click', leaveCtl);
$('btnCtlDisconnect').addEventListener('click', async ()=>{
  if (!curSerial) return;
  if (!confirm('断开设备 ' + curSerial + '？')) return;
  await api('/api/disconnect', {serial: curSerial});
  await refreshStatus();
  toast('已断开');
});

/* 应用管理 */
let appCache = [];
$('btnApps').addEventListener('click', async ()=>{
  if (!curSerial){ toast('未连接设备', 'bad'); return; }
  $('appList').innerHTML = '<p class="empty-hint" style="padding:10px 12px">正在拉取应用列表…</p>';
  const r = await api('/api/apps', {serial: curSerial});
  if (!r.ok){ $('appList').innerHTML = '<p class="empty-hint" style="padding:10px 12px">拉取失败</p>'; return; }
  appCache = r.apps || [];
  renderApps('');
  toast('共 ' + appCache.length + ' 个应用', 'ok');
});
function renderApps(filter){
  const box = $('appList');
  const list = appCache.filter(p => !filter || p.toLowerCase().includes(filter));
  if (!list.length){ box.innerHTML = '<p class="empty-hint" style="padding:10px 12px">无匹配应用</p>'; return; }
  box.innerHTML = list.map(p =>
    '<div class="approw"><span class="pkg" title="' + p + '">' + p + '</span><button class="rm" data-rm="' + p + '">卸载</button></div>'
  ).join('');
}
$('appSearch').addEventListener('input', e=> renderApps(e.target.value.trim().toLowerCase()));
$('appList').addEventListener('click', async e=>{
  const rm = e.target.closest('[data-rm]');
  if (rm){
    const pkg = rm.dataset.rm;
    if (!confirm('卸载应用 ' + pkg + '？')) return;
    const r = await api('/api/uninstall', {serial: curSerial, pkg});
    if (r.ok){ toast('已卸载 ' + pkg, 'ok'); appCache = appCache.filter(p=>p!==pkg); renderApps($('appSearch').value.trim().toLowerCase()); }
    else toast('卸载失败：' + (r.msg||''), 'bad');
  }
});
$('btnInstall').addEventListener('click', ()=>{ if (curSerial) $('apkPick').click(); else toast('未连接设备', 'bad'); });
$('apkPick').addEventListener('change', async e=>{
  const f = e.target.files[0];
  if (!f || !curSerial) return;
  toast('正在安装 ' + f.name + ' …');
  const buf = await f.arrayBuffer();
  const b64 = bufToB64(new Uint8Array(buf));
  const r = await api('/api/install', {serial: curSerial, name: f.name, data: b64});
  if (r.ok) toast('安装成功：' + f.name, 'ok');
  else toast('安装失败：' + (r.msg||'').slice(0,120), 'bad');
  e.target.value = '';
});
function bufToB64(u8){
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function requireConn(){ if (!curSerial){ toast('未连接设备', 'bad'); return false; } return true; }

/* 文件互传 */
$('pushZone').addEventListener('click', ()=>{ if (requireConn()) $('pushPick').click(); });
$('pushPick').addEventListener('change', async e=>{
  const f = e.target.files[0];
  if (!f || !curSerial) return;
  toast('正在推送 ' + f.name + ' …');
  const buf = await f.arrayBuffer();
  const b64 = bufToB64(new Uint8Array(buf));
  const r = await api('/api/push', {serial: curSerial, name: f.name, data: b64});
  if (r.ok) toast('已推送到 /sdcard/Download/' + f.name, 'ok');
  else toast('推送失败：' + (r.msg||''), 'bad');
  e.target.value = '';
});
$('btnPull').addEventListener('click', async ()=>{
  if (!requireConn()) return;
  const p = $('pullPath').value.trim();
  if (!p){ toast('请输入设备上的文件路径', 'bad'); return; }
  toast('正在拉取 ' + p + ' …');
  const r = await api('/api/pull', {serial: curSerial, path: p});
  if (r.ok){
    const blob = r.blob || new Blob([b64ToBytes(r.b64)], {type:'application/octet-stream'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = r.name || 'file';
    a.click();
    toast('已拉取到下载目录', 'ok');
  } else toast('拉取失败：' + (r.msg||''), 'bad');
});

/* 视图切换 */
function setViewCols(n){
  viewCols = n;
  const g = $('grid');
  g.classList.remove('cols1','cols2');
  if (n === 1) g.classList.add('cols1');
  else if (n === 2) g.classList.add('cols2');
  ['vs1','vs2','vs4'].forEach(id=> $(id).classList.remove('active'));
  $('vs' + n).classList.add('active');
}
$('vs1').addEventListener('click', ()=> setViewCols(1));
$('vs2').addEventListener('click', ()=> setViewCols(2));
$('vs4').addEventListener('click', ()=> setViewCols(3));
$('btnGlobalRefresh').addEventListener('click', async ()=>{
  await refreshStatus(); startGrid(); toast('已刷新', 'ok');
});

/* Shizuku 被控模式 */
const SZ = () => (IS_NATIVE && window.Capacitor.Plugins.ShizukuBridge) || null;
async function shizukuRefresh(){
  const S = SZ();
  if (!S){ $('sectSlave').style.display = 'none'; return; }
  $('sectSlave').style.display = '';
  const s = await S.status();
  const lamp = $('szLamp');
  let state, lampCls = 'lamp';
  if (!s.installed){ state = '未安装 Shizuku（shizuku.rikka.app 下载）'; }
  else if (!s.ping){ state = '已安装 · 服务未运行（打开 Shizuku 按引导启动）'; }
  else if (!s.granted){ state = '服务运行中 · 未授权本应用'; lampCls = 'lamp busy'; }
  else { state = '就绪 · 可以开启网络 ADB'; lampCls = 'lamp on'; }
  $('szState').innerHTML = '<span class="' + lampCls + '"></span> ' + state;
  return s;
}
$('btnSzCheck').addEventListener('click', ()=> shizukuRefresh().then(s => { if (s) toast('Shizuku：' + (s.installed ? (s.ping ? (s.granted ? '就绪' : '未授权') : '未运行') : '未安装'), s.granted ? 'ok' : ''); }));
$('btnSzPerm').addEventListener('click', async ()=>{
  const S = SZ(); if (!S) return;
  try { await S.requestPermission(); toast('已授权', 'ok'); await shizukuRefresh(); }
  catch(e){ toast(String(e && e.message || e), 'bad'); }
});
$('btnSzEnable').addEventListener('click', async ()=>{
  const S = SZ(); if (!S) return;
  try { await S.requestPermission(); } catch(e){ toast(String(e && e.message || e), 'bad'); return; }
  $('btnSzEnable').disabled = true; $('btnSzEnable').textContent = '开启中…';
  try {
    const r = await S.enableNetworkAdb();
    if (r.ok){
      toast(r.msg + (r.persist ? '（重启后保持）' : '（设备重启后需重新开启）'), 'ok');
      const ipr = await S.localIps();
      const ips = (ipr.ips || []).join('  ');
      if (ips){ $('szIps').textContent = ips + ' :5555'; $('szIpsRow').style.display = 'flex'; }
      await shizukuRefresh();
    } else toast(r.msg, 'bad');
  } catch(e){ toast(String(e && e.message || e), 'bad'); }
  $('btnSzEnable').disabled = false; $('btnSzEnable').textContent = '开启网络 ADB (5555)';
});
