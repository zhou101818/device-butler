name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/butler-${{ github.run_number }}-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butler-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 设备管家 build ${{ github.run_number }}
          body: |
            设备管家 安卓版安装包（固定签名，可覆盖升级）。
            安卓壳内置原生 ADB 客户端：可直连开启了网络 ADB（5555）的设备。
            电视盒子开「网络调试」即可；手机需先用电脑执行一次 adb tcpip 5555。
          files: out/*.apk
